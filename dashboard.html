<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRMJ Overblik</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: summary tiles first, then one table per question (mailboxes, leads), plain notes last. */
:root {
  --ink: #0B2527;
  --paper: #FFFFFF;
  --muted: #506568;
  --line: #D5DCDA;
  --accent: #128A73;
  --soft: #EEF4F2;
  --warn: #B4540A;
  --display: "Newsreader", Georgia, serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #EAF1EF; --paper: #0A1517; --muted: #93A9A6; --line: #223436; --accent: #4FCBAE; --soft: #10201F; --warn: #E8A15E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #EAF1EF; --paper: #0A1517; --muted: #93A9A6; --line: #223436; --accent: #4FCBAE; --soft: #10201F; --warn: #E8A15E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-bottom: 20px; border-bottom: 2px solid var(--accent); }
.mark { font-family: "Archivo Black", "Arial Black", Arial, sans-serif; font-weight: 900; font-size: 28px; letter-spacing: -1px; }
.mark b { color: var(--accent); }
h1 { font-family: var(--display); font-weight: 500; font-size: 30px; margin: 0; text-wrap: balance; }
.stamp { color: var(--muted); font-size: 13px; }
h2 { font-family: var(--display); font-weight: 500; font-size: 22px; margin: 40px 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 24px; }
.tile { border: 1px solid var(--line); padding: 16px; background: var(--paper); }
.tile.main { background: var(--soft); border-color: var(--accent); }
.tile .n { font-family: var(--display); font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-weight: 600; margin-top: 4px; }
.tile .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
tfoot td { font-weight: 600; border-top: 2px solid var(--ink); border-bottom: 0; }
.bar { display: block; height: 8px; background: var(--soft); min-width: 120px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
.pill { display: inline-block; padding: 2px 8px; border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
.pill.ok { color: var(--accent); border-color: var(--accent); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.notes { color: var(--muted); font-size: 13px; max-width: 70ch; }
.notes p { margin: 6px 0; }
.gate { position: fixed; inset: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
.gate[hidden], .wrap[hidden] { display: none; }
.gatebox { max-width: 360px; width: 100%; }
.gatebox h1 { margin: 8px 0 12px; }
.gatebox p { color: var(--muted); margin: 0 0 20px; }
button.primary { font: inherit; font-weight: 600; background: var(--ink); color: var(--paper); border: 0; padding: 12px 18px; cursor: pointer; }
button.primary:focus-visible, button.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.link { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="mark">SRMJ<b>.</b></div>
      <h1>Overblik over udsendelsen</h1>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="tiles" id="tiles" aria-label="Samlede tal"></section>

  <h2>Pr. postkasse</h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th>Postkasse</th><th class="num">Sendt i alt</th><th class="num">Sendt i dag</th><th class="num">Kladder</th></tr></thead>
      <tbody id="boxes"></tbody>
      <tfoot id="boxtotal"></tfoot>
    </table>
  </div>

  <h2>Leads i arket</h2>
  <div class="two">
    <div class="tablewrap"><table>
      <thead><tr><th>Status</th><th class="num">Antal</th><th>Andel</th></tr></thead>
      <tbody id="leads"></tbody>
      <tfoot id="leadtotal"></tfoot>
    </table></div>
    <div id="leadnotes"></div>
  </div>

  <h2>Svar fra hosts</h2>
  <section class="tiles" id="replytiles" aria-label="Svar"></section>
  <div class="tablewrap" style="margin-top:16px">
    <table>
      <thead><tr><th>Sted</th><th>Mail</th><th>Svar</th><th>Svaret</th><th>Skriv igen</th></tr></thead>
      <tbody id="replies"></tbody>
    </table>
  </div>

  <h2>Afsender</h2>
  <div id="sender"></div>

  <div class="notes" id="notes"></div>
</div>

<script id="data" type="application/json">{}</script>
<script>
function render(D) {
  var fmt = function (n) { return (n || 0).toLocaleString("da-DK"); };
  var el = function (id) { return document.getElementById(id); };
  var short = function (m) { return m.split("@")[0] + "@"; };

  var DA = {
    "Ready": "Klar til kladde", "In progress": "I gang", "Draft ready": "Kladde klar", "Sent": "Sendt",
    "Lead (reply)": "Lead (svar)", "Reply: write again in 2 months": "Svar: skriv igen om 2 mdr.",
    "No thanks": "Nej tak", "Skip": "Sprunget over", "Check skip": "Skal tjekkes (skip)", "Customer": "Kunde", "Paid": "Betalt"
  };
  var ORDER = ["Ready", "In progress", "Draft ready", "Sent", "Lead (reply)", "Reply: write again in 2 months", "Customer", "Paid", "No thanks", "Check skip", "Skip"];
  var DONE = ["Sent", "Lead (reply)", "Reply: write again in 2 months", "Customer", "Paid", "No thanks"];
  var SKIPPED = ["Skip", "Check skip"];

  var d = new Date(D.generated);
  el("stamp").textContent = (D.__live ? "Live, opdateret " : "Øjebliksbillede fra ") + d.toLocaleString("da-DK", { dateStyle: "medium", timeStyle: "short" });

  var boxes = D.mailboxes, sentBy = D.drip.sent_per_mailbox || {}, todayBy = D.drip.sent_today_per_mailbox || {};
  var sentTotal = D.drip.sent_total || 0;
  var draftsTotal = boxes.reduce(function (a, b) { return a + (b.drafts || 0); }, 0);
  var gmailSent = (D.gmail && D.gmail.sent_label_messages) || 0;

  var follow = D.sheet._followups || [], tabs = {}, status = {};
  Object.keys(D.sheet).forEach(function (k) { if (k.charAt(0) !== "_") tabs[k] = D.sheet[k]; });
  Object.keys(tabs).forEach(function (t) { Object.keys(tabs[t]).forEach(function (s) { status[s] = (status[s] || 0) + tabs[t][s]; }); });
  var leadsTotal = Object.keys(status).reduce(function (a, k) { return a + status[k]; }, 0);
  var sum = function (keys) { return keys.reduce(function (a, k) { return a + (status[k] || 0); }, 0); };
  var done = sum(DONE), skipped = sum(SKIPPED);

  function tile(n, l, s, main) {
    return '<div class="tile' + (main ? " main" : "") + '"><div class="n">' + fmt(n) + '</div><div class="l">' + l + '</div><div class="s">' + s + "</div></div>";
  }
  el("tiles").innerHTML =
    tile(sentTotal, "Sendt fra One.com", "siden 3. nov.", true) +
    tile(sentTotal + gmailSent, "Sendt i alt inkl. Gmail", "One.com + " + fmt(gmailSent) + " i Gmails Sendt-mappe", true) +
    tile(draftsTotal, "Kladder klar", "fordelt på " + boxes.length + " postkasser") +
    tile(leadsTotal, "Leads i arket", "begge faner (Hosts og Hosts - PM)") +
    tile(done, "Leads klaret", "sendt eller længere") +
    tile(skipped, "Leads sprunget over", "Skip og skal tjekkes");

  el("boxes").innerHTML = boxes.map(function (b) {
    return "<tr><td>" + b.mailbox + '</td><td class="num">' + fmt(sentBy[b.mailbox]) + '</td><td class="num">' + fmt(todayBy[b.mailbox]) + '</td><td class="num">' + (b.error ? "fejl" : fmt(b.drafts)) + "</td></tr>";
  }).join("");
  var todayTotal = Object.keys(todayBy).reduce(function (a, k) { return a + todayBy[k]; }, 0);
  el("boxtotal").innerHTML = '<tr><td>I alt</td><td class="num">' + fmt(sentTotal) + '</td><td class="num">' + fmt(todayTotal) + '</td><td class="num">' + fmt(draftsTotal) + "</td></tr>";

  var keys = ORDER.filter(function (k) { return status[k]; }).concat(Object.keys(status).filter(function (k) { return ORDER.indexOf(k) < 0; }));
  el("leads").innerHTML = keys.map(function (k) {
    var pct = leadsTotal ? Math.round(status[k] / leadsTotal * 100) : 0;
    return "<tr><td>" + (DA[k] || k) + '</td><td class="num">' + fmt(status[k]) + '</td><td><span class="bar"><i style="width:' + Math.max(pct, 1) + '%"></i></span></td></tr>';
  }).join("");
  el("leadtotal").innerHTML = '<tr><td>I alt</td><td class="num">' + fmt(leadsTotal) + "</td><td></td></tr>";

  var hosts = Object.keys(tabs.Hosts || {}).reduce(function (a, k) { return a + tabs.Hosts[k]; }, 0);
  var pm = Object.keys(tabs["Hosts - PM"] || {}).reduce(function (a, k) { return a + tabs["Hosts - PM"][k]; }, 0);
  el("leadnotes").innerHTML = '<div class="tile"><div class="l">Fordeling på faner</div><div class="s">Hosts (små udlejere): ' + fmt(hosts) + '</div><div class="s">Hosts - PM (udlejningsselskaber): ' + fmt(pm) + '</div><div class="s" style="margin-top:10px">Klaret = Sendt, Lead, Svar, Kunde, Betalt og Nej tak.</div></div>';

  var interested = follow.filter(function (f) { return /^lead/i.test(f.status); });
  var later = follow.filter(function (f) { return /^reply/i.test(f.status); });
  el("replytiles").innerHTML =
    tile(interested.length, "Interesserede", "har svaret, at de vil have det", true) +
    tile(later.length, "Skriv igen senere", "bedt om at høre fra os senere") +
    tile(follow.length, "Svar i alt", "markeret i arket");
  var dateDa = function (iso) { return iso ? new Date(iso + "T12:00:00").toLocaleDateString("da-DK", { day: "numeric", month: "short", year: "numeric" }) : "-"; };
  el("replies").innerHTML = follow.length ? follow.map(function (f) {
    var isLater = /^reply/i.test(f.status);
    return "<tr><td>" + (f.property || ("ID " + f.id)) + "</td><td>" + f.mail + '</td><td><span class="pill ' + (isLater ? "warn" : "ok") + '">' + (isLater ? "Skriv igen" : "Interesseret") + "</span></td><td>" + dateDa(f.replied) + "</td><td>" + (isLater ? dateDa(f.write_again) : "-") + "</td></tr>";
  }).join("") : '<tr><td colspan="5">Ingen svar markeret endnu.</td></tr>';

  var paused = D.drip.paused;
  var sup = D.drip.suppressed || {};
  el("sender").innerHTML =
    '<p><span class="pill ' + (paused ? "warn" : "ok") + '">' + (paused ? "Sat på pause" : "Kører") + "</span> " +
    "Bounces: " + fmt(D.drip.bounced) + " · Svar og bounces på spærrelisten: " + fmt(Object.keys(sup).reduce(function (a, k) { return a + sup[k]; }, 0)) + "</p>";

  el("notes").innerHTML =
    "<p>Sendt fra One.com er mails, som afsenderen har sendt. Gmail-tallet er alle mails i Gmails Sendt-mappe og kan også indeholde svar til kunder og testmails.</p>" +
    "<p>Arkets statusser rettes af jer. Tallene for sendt og klaret kan derfor halte bag den faktiske udsendelse.</p>" +
    "<p>Siden viser adresser kun for hosts, der har svaret. Kun srmjediting@gmail.com har adgang.</p>";
}

// ==BOOT==
var FB = {"apiKey": "AIzaSyAaZoms0g0DPmbuVp3tiAm8BE_2-L-bBCQ", "authDomain": "srmj-dashboard.firebaseapp.com", "projectId": "srmj-dashboard", "storageBucket": "srmj-dashboard.firebasestorage.app", "messagingSenderId": "190067501710", "appId": "1:190067501710:web:8a7faf862318e104a3b7df"};
var SDK = "https://www.gstatic.com/firebasejs/10.14.1/";
(async function () {
  var wrap = document.querySelector(".wrap");
  wrap.hidden = true;
  var gate = document.createElement("div");
  gate.className = "gate";
  gate.innerHTML = '<div class="gatebox"><div class="mark">SRMJ<b>.</b></div><h1>Overblik</h1><p id="gmsg">Kun for teamet. Log ind med din Google-konto.</p><button class="primary" id="gbtn" type="button">Log ind med Google</button></div>';
  document.body.appendChild(gate);
  var msg = document.getElementById("gmsg"), btn = document.getElementById("gbtn");
  var stampBox = document.getElementById("stamp");
  try {
    var A = await import(SDK + "firebase-app.js");
    var Au = await import(SDK + "firebase-auth.js");
    var F = await import(SDK + "firebase-firestore.js");
    var app = A.initializeApp(FB), auth = Au.getAuth(app), db = F.getFirestore(app);
    var unsub = null;
    btn.onclick = function () {
      Au.signInWithPopup(auth, new Au.GoogleAuthProvider()).catch(function () { msg.textContent = "Login mislykkedes. Prøv igen."; });
    };
    var out = document.createElement("button");
    out.type = "button"; out.className = "link"; out.textContent = "Log ud";
    out.onclick = function () { Au.signOut(auth); };
    stampBox.parentNode.appendChild(out);
    Au.onAuthStateChanged(auth, function (u) {
      if (unsub) { unsub(); unsub = null; }
      if (!u) { gate.hidden = false; wrap.hidden = true; return; }
      unsub = F.onSnapshot(F.doc(db, "dashboard", "stats"), function (snap) {
        if (!snap.exists()) { msg.textContent = "Der er endnu ingen tal. Start dashboard_push.py på Macen."; gate.hidden = false; wrap.hidden = true; return; }
        var s = JSON.parse(snap.data().data);
        s.__live = true;
        gate.hidden = true; wrap.hidden = false;
        render(s);
      }, function () {
        msg.textContent = (u.email || "Denne konto") + " har ikke adgang. Log ind med en anden konto.";
        btn.textContent = "Skift konto";
        Au.signOut(auth);
        gate.hidden = false; wrap.hidden = true;
      });
    });
  } catch (e) {
    msg.textContent = "Kunne ikke starte login. Prøv at genindlæse siden.";
  }
})();
</script>
</body>
</html>
